services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: openfilm
      POSTGRES_DB: openfilm
      POSTGRES_PASSWORD: ${CLOUD_DATABASE_PASSWORD:?Set CLOUD_DATABASE_PASSWORD in your local env file}
    volumes:
      - cloud-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfilm -d openfilm"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  cloud:
    build:
      context: ../..
      dockerfile: apps/cloud/Dockerfile
    environment:
      DATABASE_URL: postgres://openfilm:${CLOUD_DATABASE_PASSWORD}@postgres:5432/openfilm
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "127.0.0.1:${CLOUD_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  cloud-postgres:
