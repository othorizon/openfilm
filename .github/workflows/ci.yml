name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: openfilm
          POSTGRES_PASSWORD: openfilm-test-only
          POSTGRES_DB: openfilm_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U openfilm -d openfilm_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      OPENFILM_TEST_DATABASE_URL: postgres://openfilm:openfilm-test-only@127.0.0.1:5432/openfilm_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openfilm/cloud typecheck
      - run: pnpm --filter @openfilm/cloud test
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # a test that hangs ends the job, not hours later
    timeout-minutes: 45
    env:
      # the tests never start Electron: no need for its 100 MB download
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      # the pnpm version package.json names (packageManager)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter openfilm exec playwright-core install --with-deps chromium-headless-shell
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
        if: runner.os == 'Linux'
      - run: brew install ffmpeg
        if: runner.os == 'macOS'
      # Chocolatey reports success when its feed times out and nothing is installed: tried three times, then the step
      # fails if there is still no ffmpeg, instead of every test that needs it failing later
      - run: |
          for ($i = 1; $i -le 3 -and -not (Get-Command ffmpeg -ErrorAction SilentlyContinue); $i++) {
            choco install ffmpeg --no-progress -y
            if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { Start-Sleep -Seconds (20 * $i) }
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { Write-Error 'ffmpeg did not install'; exit 1 }
          ffmpeg -version | Select-Object -First 1
        shell: pwsh
        if: runner.os == 'Windows'
      - run: pnpm test
        env:
          # what a failing test keeps to be looked at (look's two pictures of a t that differed)
          OPENFILM_TEST_ARTIFACTS: ${{ runner.temp }}/test-artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts-${{ matrix.os }}
          path: ${{ runner.temp }}/test-artifacts
          if-no-files-found: ignore
          retention-days: 14

  # what npm would get: the tarball of openfilm, listed in the log and checked (no tests, fixtures or dev files; the
  # official product.json)
  pack:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:pack

  audit:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          # every commit, for the secret scan of the history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Secrets in the history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
      - name: The public audit (the files as they are)
        run: node scripts/audit-public.mjs
